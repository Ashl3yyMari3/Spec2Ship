<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="highBody" cx="36%" cy="30%" r="58%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="20%" stop-color="#FB923C"/>
      <stop offset="45%" stop-color="#EA580C"/>
      <stop offset="70%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>
    <radialGradient id="highRim" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="transparent"/>
      <stop offset="84%" stop-color="#F97316" stop-opacity="0.4"/>
      <stop offset="93%" stop-color="#FDBA74" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FED7AA" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="highShadow" cx="70%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#0A0500" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#0A0500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="highSpecular" cx="34%" cy="27%" r="27%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="highGlow" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="transparent"/>
      <stop offset="90%" stop-color="#EA580C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="highBand" x1="0%" y1="0%" x2="100%" y2="18%">
      <stop offset="0%" stop-color="#C2410C" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FB923C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9A3412" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="highClip">
      <circle cx="150" cy="150" r="108"/>
    </clipPath>
    <filter id="highBlur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <circle cx="150" cy="150" r="135" fill="url(#highGlow)" filter="url(#highBlur)"/>
  <circle cx="150" cy="150" r="108" fill="url(#highBody)"/>

  <g clip-path="url(#highClip)">
    <ellipse cx="150" cy="128" rx="108" ry="15" fill="url(#highBand)" transform="rotate(-6 150 128)" opacity="0.9"/>
    <ellipse cx="150" cy="158" rx="108" ry="12" fill="url(#highBand)" transform="rotate(-4 150 158)" opacity="0.7"/>
    <ellipse cx="150" cy="182" rx="108" ry="14" fill="url(#highBand)" transform="rotate(-8 150 182)" opacity="0.6"/>
    <ellipse cx="138" cy="142" rx="52" ry="5" fill="#FBBF24" opacity="0.1"/>
    <ellipse cx="165" cy="168" rx="58" ry="5" fill="#EA580C" opacity="0.08"/>
  </g>

  <circle cx="150" cy="150" r="108" fill="url(#highShadow)"/>
  <circle cx="150" cy="150" r="108" fill="url(#highRim)"/>
  <circle cx="150" cy="150" r="108" fill="url(#highSpecular)"/>
  <circle cx="150" cy="150" r="111" fill="none" stroke="#F97316" stroke-width="2.5" opacity="0.25"/>
  <circle cx="150" cy="150" r="114" fill="none" stroke="#EA580C" stroke-width="1.5" opacity="0.1"/>
</svg>
