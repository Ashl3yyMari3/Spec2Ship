<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="medBody" cx="37%" cy="31%" r="58%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="22%" stop-color="#FACC15"/>
      <stop offset="48%" stop-color="#CA8A04"/>
      <stop offset="72%" stop-color="#854D0E"/>
      <stop offset="100%" stop-color="#422006"/>
    </radialGradient>
    <radialGradient id="medRim" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="transparent"/>
      <stop offset="84%" stop-color="#EAB308" stop-opacity="0.4"/>
      <stop offset="93%" stop-color="#FDE047" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FEF9C3" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="medShadow" cx="70%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#090600" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#090600" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="medSpecular" cx="35%" cy="28%" r="28%">
      <stop offset="0%" stop-color="#FEF9C3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="medGlow" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="transparent"/>
      <stop offset="90%" stop-color="#CA8A04" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="medBand" x1="0%" y1="0%" x2="100%" y2="18%">
      <stop offset="0%" stop-color="#A16207" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FACC15" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#854D0E" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="medClip">
      <circle cx="150" cy="150" r="108"/>
    </clipPath>
    <filter id="medBlur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <circle cx="150" cy="150" r="135" fill="url(#medGlow)" filter="url(#medBlur)"/>
  <circle cx="150" cy="150" r="108" fill="url(#medBody)"/>

  <g clip-path="url(#medClip)">
    <ellipse cx="150" cy="130" rx="108" ry="14" fill="url(#medBand)" transform="rotate(-6 150 130)" opacity="0.9"/>
    <ellipse cx="150" cy="157" rx="108" ry="12" fill="url(#medBand)" transform="rotate(-4 150 157)" opacity="0.75"/>
    <ellipse cx="150" cy="180" rx="108" ry="13" fill="url(#medBand)" transform="rotate(-8 150 180)" opacity="0.6"/>
    <ellipse cx="140" cy="143" rx="50" ry="5" fill="#FDE047" opacity="0.1"/>
    <ellipse cx="162" cy="167" rx="56" ry="4" fill="#CA8A04" opacity="0.08"/>
  </g>

  <circle cx="150" cy="150" r="108" fill="url(#medShadow)"/>
  <circle cx="150" cy="150" r="108" fill="url(#medRim)"/>
  <circle cx="150" cy="150" r="108" fill="url(#medSpecular)"/>
  <circle cx="150" cy="150" r="111" fill="none" stroke="#EAB308" stroke-width="2.5" opacity="0.25"/>
  <circle cx="150" cy="150" r="114" fill="none" stroke="#CA8A04" stroke-width="1.5" opacity="0.1"/>
