  <defs>
    <radialGradient id="nebula1" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#6B21A8" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#4C1D95" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
