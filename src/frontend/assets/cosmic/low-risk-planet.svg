<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340">
  <defs>
    <radialGradient id="lowBody" cx="36%" cy="30%" r="58%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="22%" stop-color="#22D3EE"/>
      <stop offset="48%" stop-color="#0891B2"/>
      <stop offset="72%" stop-color="#164E63"/>
      <stop offset="100%" stop-color="#082032"/>
    </radialGradient>
    <radialGradient id="lowRim" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="transparent"/>
      <stop offset="84%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="93%" stop-color="#67E8F9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#CFFAFE" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="lowShadow" cx="70%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#000C0F" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#000C0F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="lowSpecular" cx="34%" cy="27%" r="28%">
      <stop offset="0%" stop-color="#E0F7FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="lowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="transparent"/>
      <stop offset="90%" stop-color="#0891B2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.05"/>
    </radialGradient>
    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="medBand" x1="0%" y1="0%" x2="100%" y2="18%">
      <stop offset="0%" stop-color="#0E7490" stop-opacity="0"/>
      <stop offset="40%" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#164E63" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lowClip">
      <circle cx="170" cy="170" r="108"/>
    </clipPath>
    <filter id="lowBlur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="ringBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Outer glow -->
  <circle cx="170" cy="170" r="140" fill="url(#lowGlow)" filter="url(#lowBlur)"/>

  <!-- Ring back half (behind planet) -->
  <ellipse cx="170" cy="195" rx="155" ry="22" fill="none" stroke="url(#ringGrad)" stroke-width="8" opacity="0.5"/>
  <ellipse cx="170" cy="195" rx="168" ry="26" fill="none" stroke="url(#ringGrad2)" stroke-width="5" opacity="0.3"/>

  <!-- Planet body -->
  <circle cx="170" cy="170" r="108" fill="url(#lowBody)"/>

  <!-- Surface bands -->
  <g clip-path="url(#lowClip)">
    <ellipse cx="170" cy="147" rx="108" ry="14" fill="url(#medBand)" transform="rotate(-6 170 147)" opacity="0.9"/>
    <ellipse cx="170" cy="172" rx="108" ry="11" fill="url(#medBand)" transform="rotate(-4 170 172)" opacity="0.7"/>
    <ellipse cx="170" cy="195" rx="108" ry="13" fill="url(#medBand)" transform="rotate(-7 170 195)" opacity="0.6"/>
    <ellipse cx="158" cy="158" rx="50" ry="5" fill="#67E8F9" opacity="0.1"/>
    <ellipse cx="182" cy="182" rx="56" ry="4" fill="#0891B2" opacity="0.08"/>
  </g>

  <!-- Shadow terminator -->
  <circle cx="170" cy="170" r="108" fill="url(#lowShadow)"/>

  <!-- Atmospheric rim -->
  <circle cx="170" cy="170" r="108" fill="url(#lowRim)"/>

  <!-- Specular -->
  <circle cx="170" cy="170" r="108" fill="url(#lowSpecular)"/>

  <!-- Ring front half (in front of planet lower portion) -->
  <ellipse cx="170" cy="195" rx="155" ry="22" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.6"
    stroke-dasharray="490 488" stroke-dashoffset="245"/>

  <!-- Atmospheric ring -->
  <circle cx="170" cy="170" r="111" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.25"/>
</svg>
