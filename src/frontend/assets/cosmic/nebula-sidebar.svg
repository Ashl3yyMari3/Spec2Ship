<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sideNebula1" cx="30%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#5B21B6" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#3B0764" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="sideNebula2" cx="70%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#4C1D95" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="sideNebula3" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#BE185D" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#9D174D" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="sideNebula4" cx="85%" cy="60%" r="38%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#1E40AF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="nebulaBlur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep dark base (transparent for sidebar overlay) -->
  <rect width="600" height="400" fill="#080B18" opacity="0.95"/>

  <!-- Nebula layers -->
  <rect width="600" height="400" fill="url(#sideNebula1)" filter="url(#nebulaBlur)"/>
  <rect width="600" height="400" fill="url(#sideNebula2)" filter="url(#nebulaBlur)"/>
  <rect width="600" height="400" fill="url(#sideNebula3)" filter="url(#nebulaBlur)"/>
  <rect width="600" height="400" fill="url(#sideNebula4)" filter="url(#nebulaBlur)"/>

  <!-- Stars -->
  <g filter="url(#starGlow)">
    <circle cx="45" cy="34" r="0.9" fill="#E9D5FF" opacity="0.85"/>
    <circle cx="123" cy="67" r="0.7" fill="#F8FAFC" opacity="0.8"/>
    <circle cx="278" cy="23" r="1.0" fill="#BFDBFE" opacity="0.9"/>
    <circle cx="389" cy="89" r="0.8" fill="#F8FAFC" opacity="0.75"/>
    <circle cx="512" cy="45" r="0.9" fill="#E9D5FF" opacity="0.85"/>
    <circle cx="56" cy="145" r="0.7" fill="#F8FAFC" opacity="0.8"/>
    <circle cx="189" cy="178" r="1.1" fill="#BFDBFE" opacity="0.85"/>
    <circle cx="334" cy="156" r="0.8" fill="#F8FAFC" opacity="0.8"/>
    <circle cx="467" cy="134" r="0.9" fill="#E9D5FF" opacity="0.75"/>
    <circle cx="78" cy="267" r="0.8" fill="#F8FAFC" opacity="0.8"/>
    <circle cx="223" cy="312" r="1.0" fill="#BFDBFE" opacity="0.85"/>
    <circle cx="356" cy="289" r="0.7" fill="#E9D5FF" opacity="0.8"/>
    <circle cx="489" cy="234" r="0.9" fill="#F8FAFC" opacity="0.75"/>
    <circle cx="567" cy="312" r="0.8" fill="#BFDBFE" opacity="0.85"/>
    <circle cx="34" cy="356" r="0.9" fill="#F8FAFC" opacity="0.8"/>
    <circle cx="145" cy="378" r="0.7" fill="#E9D5FF" opacity="0.75"/>
    <circle cx="312" cy="367" r="1.0" fill="#F8FAFC" opacity="0.8"/>
    <circle cx="445" cy="345" r="0.8" fill="#BFDBFE" opacity="0.85"/>
    <circle cx="556" cy="378" r="0.9" fill="#F8FAFC" opacity="0.75"/>
  </g>
</svg>
